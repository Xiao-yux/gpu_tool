<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>厚茂科技</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <script src="{{ url_for('static', filename='js/api.js') }}"></script>
</head>
<body>

    <!-- 顶部 Header -->
    <header>
        <div class="logo">
            <!-- 简单的 SVG Logo -->
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
            </svg>
            服务器管理后台
        </div>
    </header>

    <!-- 主体布局 -->
    <div class="layout-container">
        
        <!-- 左侧侧边栏 -->
        <aside>
            <div class="menu-title">功能菜单</div>
            <ul class="nav-list">
                <li class="nav-item">
                    <a href="#" class="nav-link active" onclick="setActive(this)">
                        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
                        仪表盘
                    </a>
                    
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link" onclick="setActive(this)">
                        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                        服务器批量管理
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/tasks" class="nav-link">
                        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
                        指令表单
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link" onclick="setActive(this)">
                        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L5.09 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.04.64.09.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
                        系统设置
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link" onclick="setActive(this)">
                        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
                        帮助中心
                    </a>
                </li>
            </ul>
        </aside>

        <!-- 右侧内容区 -->
        <main id="main-content">
            <div class="content-header">
                <div class="breadcrumb">首页 / 仪表盘</div>
                <h1 class="page-title">仪表盘概览</h1>
            </div>

            <!-- 客户端列表 -->
            <div class="clients-container" id="maininfo">
                <div id="conn1">
                    <div class="clients-header">
                        <h2>已连接客户端</h2>
                        <span class="clients-count">0 个客户端</span>
                    </div>
                    <div class="clients-list" id="clientsList">
                        <!-- 客户端标签将通过 JavaScript 动态添加 -->
                    </div>
                </div>
                    <!-- 客户端详情面板 -->
                <div class="client-details-panel" id="clientDetailsPanel" style="display: none;">
                    <div class="details-header">
                        <h3>客户端详情</h3>
                        <div class="details-title-info">
                            <span id="detailManufacturer">-</span>
                            <span id="detailPn">-</span>
                        </div>
                        <button class="close-btn" onclick="closeDetails()">×</button>
                    </div>
                    <div class="details-content">
                        <div class="detail-tabs">
                            <button class="tab-btn active" data-tab="cpuinfo">CPU信息</button>
                            <button class="tab-btn" data-tab="meminfo">内存信息</button>
                            <button class="tab-btn" data-tab="diskinfo">磁盘信息</button>
                            <button class="tab-btn" data-tab="netinfo">网络信息</button>
                            <button class="tab-btn" data-tab="psuinfo">电源信息</button>
                            <button class="tab-btn" data-tab="gpuinfo">GPU信息</button>
                            <button class="refresh-btn" id="refreshBtn" onclick="refreshCurrentClient()">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M23 4v6h-6"/>
                                    <path d="M1 20v-6h6"/>
                                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
                                </svg>
                                刷新
                            </button>
                        </div>
                        <div id="cpuinfo">
                        <div class="detail-info">
                            <div class="info-item">
                                <span class="info-label">bmcIP地址:</span>
                                <span class="info-value" id="detailIp">-</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">机器序列号:</span>
                                <span class="info-value" id="detailSN">-</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">更新时间:</span>
                                <span class="info-value" id="detailTime">-</span>
                            </div>
                        </div>
                        <div class="tab-content" id="tabContent">
                            <pre id="tabContentText">cpuinfo</pre>
                        </div>
                        </div>
                        <div id="meminfo" style="display:none;">
                            <div class="tab-content">
                                <pre id="tabContentTextMem">meminfo</pre>
                            </div>
                        </div>
                        <div id="diskinfo" style="display:none;">
                            <div class="tab-content">
                                <pre id="tabContentTextDisk">diskinfo</pre>
                            </div>
                        </div>
                        <div id="netinfo" style="display:none;">
                            <div class="tab-content">
                                <pre id="tabContentTextNet">netinfo</pre>
                            </div>
                        </div>
                        <div id="psuinfo" style="display:none;">
                            <div class="tab-content">
                                <pre id="tabContentTextPsu">psuinfo</pre>
                            </div>
                        </div>
                        <div id="gpuinfo" style="display:none;">
                            <div class="tab-content">
                                <pre id="tabContentTextGpu">gpuinfo</pre>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        </div>
            </div>

            

    <script>
        // 简单的脚本：处理菜单点击切换样式
        function setActive(element) {
            // 移除所有链接的 active 类
            const links = document.querySelectorAll('.nav-link');
            links.forEach(link => link.classList.remove('active'));
            
            // 给当前点击的链接添加 active 类
            element.classList.add('active');

            // 更新面包屑和标题（模拟效果）
            const titleText = element.innerText.trim();
            document.querySelector('.page-title').innerText = titleText;
            document.querySelector('.breadcrumb').innerHTML = `首页 / ${titleText}`;
        }
    </script>
</body>
</html>
