# Configuration file for tools that don't yet support pyproject.toml natively
# (kept minimal; new tool configuration belongs in pyproject.toml)

[metadata]
name = gpu_tool
version = attr: gpu_tool._version.__version__

[flake8]
max-line-length = 110
extend-ignore = E203, E501, W503
exclude = build, dist, .venv, .eggs, *.egg-info

[isort]
profile = black
line_length = 110
known_first_party = gpu_tool